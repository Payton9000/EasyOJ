{% extends "base.html" %}
{% block title %}Login - OJ System{% endblock %}
{% block content %}
<div style="max-width:400px; margin:60px auto;">
    <div class="card">
        <h2 style="text-align:center; margin-bottom:24px; color:#e94560;">Login</h2>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Login</button>
        </form>
        <p style="text-align:center; margin-top:16px; color:#aaa;">
            No account? <a href="/register">Register</a>
        </p>
    </div>
</div>
{% endblock %}
