{% extends "admin/admin_base.html" %}
{% block admin_content %}
<h2>{{ t('admin.edit') if contest else t('admin.create') }} {{ t('admin.contests') }}</h2>
<form method="POST" style="background:var(--surface);padding:20px;border-radius:8px;max-width:600px;border:1px solid var(--border);"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>{{ t('contests.title_label') }} *<input type="text" name="title" value="{{ contest.title if contest else '' }}" required></label>
<label>{{ t('admin.form_description') }}<textarea name="description" rows="4">{{ contest.description if contest else '' }}</textarea></label>
<label>{{ t('contests.start') }} *<input type="datetime-local" name="start_time" value="{% if contest %}{{ contest.start_time | local_datetime_input }}{% endif %}" required></label>
<label>{{ t('contests.end') }} *<input type="datetime-local" name="end_time" value="{% if contest %}{{ contest.end_time | local_datetime_input }}{% endif %}" required></label>
<label>{{ t('contests.participants') }}<input type="number" name="max_participants" min="0" value="{{ contest.max_participants if contest else 0 }}" placeholder="0 = {{ t('admin.unlimited') }}"></label>
<label>{{ t('auth.password') }}<input type="password" name="password" value="" autocomplete="new-password" placeholder="{{ t('contest.password_placeholder') }}"></label>
<label><input type="checkbox" name="is_public" {% if not contest or contest.is_public %}checked{% endif %}> {{ t('admin.form_public') }}</label>
<label><input type="checkbox" name="is_sealed" {% if contest and contest.is_sealed %}checked{% endif %}> {{ t('admin.ranklist_sealed') }}</label>
<button type="submit" class="btn btn-primary">{{ t('admin.save') }}</button> <a href="{{ url_for('admin.contests_list') }}" class="btn btn-secondary">{{ t('admin.cancel') }}</a></form>
{% endblock %}
