{% extends "base.html" %}

{% block title %} - 管理后台{% endblock %}

{% block content %}
<style>
    .admin-container {
        display: flex;
        flex: 1;
    }
    
    .admin-sidebar {
        width: 220px;
        background-color: var(--surface-2);
        border-right: 1px solid var(--border);
        padding-top: 20px;
        position: relative;
        height: calc(100vh - 60px);
    }
    
    .admin-sidebar a {
        display: block;
        padding: 12px 20px;
        color: var(--text-muted);
        text-decoration: none;
        border-left: 3px solid transparent;
        transition: all 0.3s;
    }
    
    .admin-sidebar a:hover {
        color: var(--text);
        background-color: var(--bg-accent);
        border-left-color: var(--brand);
    }
    
    .admin-sidebar a.active {
        color: var(--text);
        background-color: var(--bg-accent);
        border-left-color: var(--brand);
    }
    
    .admin-content {
        flex: 1;
        padding: 30px;
    }
    
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }
    
    .stat-card {
        background-color: var(--surface);
        padding: 20px;
        border-radius: 8px;
        border-left: 4px solid var(--brand);
        border: 1px solid var(--border);
    }
    
    .stat-card.user { border-left-color: #0099ff; }
    .stat-card.problem { border-left-color: #00ff88; }
    .stat-card.submission { border-left-color: #ffaa00; }
    .stat-card.ac { border-left-color: #00ff88; }
    .stat-card.contest { border-left-color: #cc99ff; }
    .stat-card.active { border-left-color: #ff6699; }
    
    .stat-value {
        font-size: 2em;
        color: var(--text);
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    .stat-label {
        color: var(--text-muted);
        font-size: 0.9em;
    }
    
    @media (max-width: 768px) {
        .admin-container {
            flex-direction: column;
        }
        
        .admin-sidebar {
            width: 100%;
            height: auto;
            display: flex;
            border-right: none;
            border-bottom: 1px solid var(--border);
        }
        
        .admin-sidebar a {
            padding: 8px 15px;
            font-size: 0.9em;
            border-left: none;
            border-bottom: 2px solid transparent;
        }
        
        .admin-sidebar a.active {
            border-left: none;
            border-bottom-color: var(--brand);
        }
        
        .stats-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: var(--surface);
        margin-top: 20px;
        border: 1px solid var(--border);
    }
    
    table thead {
        background-color: var(--surface-2);
        border-bottom: 2px solid var(--border);
    }
    
    table th {
        padding: 12px;
        text-align: left;
        color: var(--text);
        font-weight: 500;
    }
    
    table td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
    }
    
    table tr:hover {
        background-color: var(--bg-accent);
    }
    
    .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        display: inline-block;
    }
    
    .badge.success { background-color: var(--success); color: #fff; }
    .badge.warning { background-color: var(--warn); color: #000; }
    .badge.error { background-color: var(--danger); color: #fff; }
    .badge.info { background-color: var(--info); color: #fff; }
    
    .btn {
        padding: 8px 16px;
        margin: 5px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        font-size: 0.9em;
        transition: all 0.3s;
    }
    
    .btn-primary {
        background-color: var(--brand);
        color: #fff;
    }
    
    .btn-primary:hover {
        background-color: var(--brand-strong);
    }
    
    .btn-danger {
        background-color: var(--danger);
        color: #fff;
    }
    
    .btn-danger:hover {
        background-color: var(--danger-strong);
    }
    
    .btn-small {
        padding: 4px 8px;
        font-size: 0.8em;
    }
</style>

<div class="admin-container">
    <div class="admin-sidebar">
        <a href="{{ url_for('admin.dashboard') }}" class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">📊 仪表盘</a>
        <a href="{{ url_for('admin.problems_list') }}" class="{% if 'problem' in request.endpoint %}active{% endif %}">📝 题目管理</a>
        <a href="{{ url_for('admin.contests_list') }}" class="{% if 'contest' in request.endpoint %}active{% endif %}">🏆 竞赛管理</a>
        <a href="{{ url_for('admin.users_list') }}" class="{% if request.endpoint == 'admin.users_list' %}active{% endif %}">👥 用户管理</a>
        <a href="{{ url_for('admin.submissions_list') }}" class="{% if 'submission' in request.endpoint %}active{% endif %}">📤 提交记录</a>
        <a href="{{ url_for('admin.judge_status') }}" class="{% if request.endpoint == 'admin.judge_status' %}active{% endif %}">⚙️ 判题监控</a>
    </div>
    
    <div class="admin-content">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
