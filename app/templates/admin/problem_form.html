{% extends "admin/admin_base.html" %}
{% block admin_content %}
<h2>{{ t('admin.edit') if problem else t('admin.create') }} {{ t('admin.problems') }}</h2>
<form method="POST" style="background:var(--surface);padding:20px;border-radius:8px;max-width:600px;border:1px solid var(--border);"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div><label>{{ t('admin.form_title') }} *</label><input type="text" name="title" value="{{ problem.title if problem else '' }}" required style="width:100%;padding:8px;box-sizing:border-box;"></div>
<div><label>{{ t('admin.form_description') }} *</label><textarea name="description" rows="5" required style="width:100%;box-sizing:border-box;">{{ problem.description if problem else '' }}</textarea></div>
<div><label>{{ t('admin.form_input') }}</label><textarea name="input_description" rows="3" style="width:100%;box-sizing:border-box;">{{ problem.input_description if problem else '' }}</textarea></div>
<div><label>{{ t('admin.form_output') }}</label><textarea name="output_description" rows="3" style="width:100%;box-sizing:border-box;">{{ problem.output_description if problem else '' }}</textarea></div>
<div><label>{{ t('admin.form_sample_input') }}</label><textarea name="sample_input" rows="2" style="width:100%;box-sizing:border-box;">{{ problem.sample_input if problem else '' }}</textarea></div>
<div><label>{{ t('admin.form_sample_output') }}</label><textarea name="sample_output" rows="2" style="width:100%;box-sizing:border-box;">{{ problem.sample_output if problem else '' }}</textarea></div>
<div><label>{{ t('admin.form_time_limit') }}</label><input type="number" name="time_limit" value="{{ problem.time_limit if problem else 1000 }}" required></div>
<div><label>{{ t('admin.form_memory_limit') }}</label><input type="number" name="memory_limit" value="{{ problem.memory_limit if problem else 256 }}" required></div>
<div><label>{{ t('problems.difficulty') }}</label><select name="difficulty"><option value="easy" {% if problem and problem.difficulty=='easy' %}selected{% endif %}>{{ t('problems.easy') }}</option><option value="medium" {% if problem and problem.difficulty=='medium' %}selected{% endif %}>{{ t('problems.medium') }}</option><option value="hard" {% if problem and problem.difficulty=='hard' %}selected{% endif %}>{{ t('problems.hard') }}</option></select></div>
<div><label>{{ t('admin.form_source') }}</label><input type="text" name="source" value="{{ problem.source if problem else '' }}"></div>
<label><input type="checkbox" name="is_public" {% if not problem or problem.is_public %}checked{% endif %}> {{ t('admin.form_public') }}</label>
<div><button type="submit" class="btn btn-primary">{{ t('admin.save') }}</button><a href="{{ url_for('admin.problems_list') }}" class="btn btn-secondary">{{ t('admin.cancel') }}</a></div></form>
{% if problem %}<h3>{{ t('admin.upload_testcase') }}</h3><form method="POST" action="{{ url_for('admin.upload_testcase', problem_id=problem.id) }}" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t('admin.input_file') }}<input type="file" name="input_file" required></label><label>{{ t('admin.output_file') }}<input type="file" name="output_file" required></label><button type="submit" class="btn btn-primary">{{ t('admin.upload') }}</button></form>{% endif %}
{% endblock %}
