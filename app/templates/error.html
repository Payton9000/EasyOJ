{% extends "base.html" %}
{% block title %}{{ error_code }} - {{ config['SITE_NAME'] }}{% endblock %}
{% block content %}
<div class="error-page card" role="alert">
    <h1 class="error-code">{{ error_code }}</h1>
    <p class="error-message">{{ error_message }}</p>
    {% if error_code in (400, 405) %}<p class="form-help">{{ t('error.draft_kept') }}</p>{% endif %}
    <div class="button-row error-actions">
        <button type="button" class="btn btn-secondary" onclick="history.back()">{{ t('error.go_back') }}</button>
        <a href="{{ url_for('web.problem_list') }}" class="btn btn-primary">{{ t('error.back_home') }}</a>
    </div>
</div>
{% endblock %}
