{% extends "base.html" %}
{% block title %}Submit - {{ problem.title }} - OJ System{% endblock %}
{% block content %}
<div class="card">
    <h2 style="color:#e94560; margin-bottom:16px;">Submit: {{ problem.title }}</h2>
    <form method="POST" action="/problem/{{ problem.id }}/submit">
        <div class="form-group">
            <label for="language">Language</label>
            <select name="language" id="language" style="width:200px;">
                {% for lang_key, lang_info in supported_languages.items() %}
                <option value="{{ lang_key }}">{{ lang_info.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="code">Your Code</label>
            <textarea name="code" id="code" rows="25"
                style="font-family: 'Consolas', 'Courier New', monospace; font-size:0.95rem;"
                placeholder="Write your solution here..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="/problem/{{ problem.id }}" class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
