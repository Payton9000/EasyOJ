{% extends "base.html" %}
{% block title %}{{ t('auth.register') }} - {{ config['SITE_NAME'] }}{% endblock %}
{% block content %}
<section class="auth-card card">
    <h1 class="page-title">{{ t('auth.register') }}</h1>
    <form method="POST" action="{{ url_for('web.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">{{ t('auth.username') }}</label>
            <input type="text" id="username" name="username" minlength="3" maxlength="32" autocomplete="username" required autofocus
                   value="{{ username | default('', true) }}">
            <div class="form-help">{{ t('auth.register.help') }}</div>
        </div>
        <div class="form-group">
            <label for="email">{{ t('auth.email') }}</label>
            <input type="email" id="email" name="email" maxlength="120" autocomplete="email" required
                   value="{{ email | default('', true) }}">
        </div>
        <div class="form-group">
            <label for="password">{{ t('auth.password') }}</label>
            <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">{{ t('auth.confirm_password') }}</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" id="register-submit" type="submit" data-action="register">{{ t('auth.register.create') }}</button>
    </form>
    <p class="auth-links">{{ t('auth.register.already') }} <a href="{{ url_for('web.login') }}">{{ t('auth.login') }}</a>.</p>
</section>
{% endblock %}
