{% extends "base.html" %}
{% block title %}{{ t('auth.login') }} - EasyOJ{% endblock %}
{% block content %}
<section class="auth-card card">
    <h1 class="page-title">{{ t('auth.login') }}</h1>
    <form method="POST" action="{{ url_for('web.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">{{ t('auth.username') }}</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">{{ t('auth.password') }}</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">{{ t('auth.login') }}</button>
    </form>
    <p class="auth-links">{{ t('auth.login.no_account') }} <a href="{{ url_for('web.register') }}">{{ t('auth.login.register_here') }}</a>.</p>
</section>
{% endblock %}
